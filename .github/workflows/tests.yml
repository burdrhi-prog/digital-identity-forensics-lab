name: Forensics demo tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run demonstration tests
        run: python -m unittest discover -s demo -v
      - name: Install PDF report dependency
        run: python -m pip install -r requirements-report.txt
      - name: Generate shareable PDF
        run: python demo/publish_report.py --output /tmp/fictional_case_report.pdf
      - name: Reproduce fictional report
        run: python demo/case_study_report.py > /tmp/fictional-case-study.md
